<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다운로더</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 상단 바 (창 드래그 영역) -->
<header class="topbar">
  <div class="pywebview-drag-region drag-layer"></div>
  <div class="traffic">
    <button class="light red" id="btn-close" title="닫기"></button>
    <button class="light yellow" id="btn-min" title="최소화"></button>
    <button class="light green" id="btn-max" title="최대화"></button>
  </div>
  <span class="app-title">다운로더</span>
  <div class="topbar-right">
    <button class="icon-btn" id="btn-open-folder" title="다운로드 폴더 열기">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M1.5 4A1.5 1.5 0 0 1 3 2.5h3l1.5 2H13A1.5 1.5 0 0 1 14.5 6v6A1.5 1.5 0 0 1 13 13.5H3A1.5 1.5 0 0 1 1.5 12V4z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" title="설정">
      <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    </button>
    <button class="btn primary" id="btn-paste">＋ 링크 붙여넣기 <kbd>Ctrl V</kbd></button>
  </div>
</header>

<!-- 바이너리 설치/오류 배너 -->
<div class="banner" id="banner" hidden></div>

<main class="content">
  <div class="filters" id="filters" hidden>
    <button class="pill active" data-filter="all">전체</button>
    <button class="pill" data-filter="active">진행 중</button>
    <button class="pill" data-filter="done">완료</button>
    <span class="spacer"></span>
    <button class="btn ghost small" id="btn-clear">완료 항목 지우기</button>
  </div>

  <div class="empty" id="empty">
    <svg viewBox="0 0 48 48" width="56" height="56"><path d="M24 8v22m0 0-8-8m8 8 8-8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 38h28" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    <p>영상 링크를 붙여넣으면 여기에 표시됩니다</p>
    <button class="btn primary" id="btn-paste-empty">링크 붙여넣기</button>
  </div>

  <div class="list" id="list"></div>
</main>

<!-- 링크/화질 선택 모달 -->
<div class="overlay" id="modal" hidden>
  <div class="panel">
    <div class="panel-head">
      <input type="text" id="url-input" placeholder="https:// 영상 또는 재생목록 주소" spellcheck="false">
      <button class="btn primary" id="btn-fetch">조회</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-foot" id="panel-foot" hidden>
      <div class="fmt-pills" id="fmt-pills"></div>
      <button class="btn primary" id="btn-download">다운로드</button>
    </div>
  </div>
</div>

<!-- 설정 모달 -->
<div class="overlay" id="settings-modal" hidden>
  <div class="panel narrow">
    <h3>설정</h3>
    <div class="setting-row">
      <div><div class="setting-label">저장 폴더</div><div class="setting-value" id="out-dir"></div></div>
      <button class="btn" id="btn-choose-folder">변경</button>
    </div>
    <div class="setting-row">
      <div class="setting-label">동시 다운로드</div>
      <select id="sel-concurrent"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    </div>
    <div class="setting-row">
      <div class="setting-label">yt-dlp 업데이트</div>
      <button class="btn" id="btn-update">확인</button>
    </div>
    <p class="credit">yt-dlp · ffmpeg 기반 · MIT</p>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
